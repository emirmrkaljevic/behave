name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: smoke test against coreutils
        run: |
          go build -o behave ./cmd/behave
          ./behave probe wc --out /tmp/spec-wc
          ./behave run /tmp/spec-wc
          ./behave run examples/cut
          ./behave run examples/paste
          ./behave run examples/join
          ./behave run examples/nl
          ./behave run examples/fold
          ./behave run examples/jq
          PATH="$PWD:$PATH" ./behave run examples/behave
