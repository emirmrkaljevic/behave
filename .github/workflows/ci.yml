name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: put GNU coreutils first on PATH
        run: |
          # ubuntu-latest (26.04) defaults to uutils; GNU remains as /usr/bin/gnucut etc.
          # The example specs were recorded from GNU, so replay must use GNU.
          if compgen -G /usr/bin/gnu* >/dev/null; then
            gnu_bin="${RUNNER_TEMP}/gnu-bin"
            mkdir -p "$gnu_bin"
            for src in /usr/bin/gnu*; do
              name="${src##*/}"
              name="${name#gnu}"
              ln -s "$src" "$gnu_bin/$name"
            done
            echo "$gnu_bin" >> "$GITHUB_PATH"
            echo "Using GNU coreutils from $gnu_bin"
          else
            echo "No gnu-prefixed coreutils; assuming the default cut is GNU"
          fi
      - name: smoke test against coreutils
        run: |
          cut --version | head -1
          if ! cut --version | head -1 | grep -q GNU; then
            echo "examples were recorded from GNU coreutils; cut on PATH is not GNU" >&2
            exit 1
          fi
          go build -o behave ./cmd/behave
          ./behave probe wc --out /tmp/spec-wc
          ./behave run /tmp/spec-wc
          ./behave run examples/cut
          ./behave run examples/paste
          ./behave run examples/join
          ./behave run examples/nl
          ./behave run examples/fold
          ./behave run examples/head
          ./behave run examples/expand
          ./behave run examples/unexpand
          ./behave run examples/tr
          ./behave run examples/comm
          ./behave run examples/uniq
          ./behave run examples/sort
          ./behave run examples/cat
          ./behave run examples/wc
          ./behave run examples/tac
          ./behave run examples/numfmt
          ./behave run examples/od
          ./behave run examples/basenc
          # base32/base64 -d accept unpadded input since GNU coreutils 9.5
          # (the runner ships 9.4), so those cases are tagged gnu-9.5
          ./behave run examples/base32 --skip-tag gnu-9.5
          ./behave run examples/base64 --skip-tag gnu-9.5
          ./behave run examples/seq
          ./behave run examples/expr
          ./behave run examples/printf
          ./behave run examples/factor
          ./behave run examples/basename
          ./behave run examples/dirname
          ./behave run examples/realpath
          ./behave run examples/pr
          ./behave run examples/tee
          ./behave run examples/split
          ./behave run examples/tsort
          ./behave run examples/csplit
          # ptx -t output changed after GNU 9.7; that case is tagged gnu-9.12
          ./behave run examples/ptx --skip-tag gnu-9.12
          ./behave run examples/echo
          ./behave run examples/readlink
          # env shell-quotes values since GNU 9.12 and has -a since 9.5
          ./behave run examples/env --skip-tag gnu-9.12 --skip-tag gnu-9.5
          # the built-in dircolors database changes between releases
          ./behave run examples/dircolors --skip-tag gnu-9.12
          # test has the POSIX:2024 < and > string operators since GNU 9.6
          ./behave run examples/test --skip-tag gnu-9.6
          # date: --debug wording and the multiple-formats error are GNU 9.12, --resolution 9.6
          ./behave run examples/date --skip-tag gnu-9.12 --skip-tag gnu-9.6
          ./behave run examples/xargs
          PATH="/usr/sbin:/sbin:$PATH" ./behave run examples/sysctl
          ./behave run examples/jq
          PATH="$PWD:$PATH" ./behave run examples/behave
