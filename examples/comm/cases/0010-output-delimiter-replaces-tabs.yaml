name: output-delimiter replaces tabs
args:
  - '--output-delimiter=::'
  - a
  - b
files:
  a: |
    apple
    banana
    cherry
    date
  b: |
    banana
    cherry
    fig
    grape
tags:
  - manual
expect:
  exit: 0
  stdout: |
    apple
    ::::banana
    ::::cherry
    date
    ::fig
    ::grape
  stderr: ""
