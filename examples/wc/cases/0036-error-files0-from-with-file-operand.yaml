name: 'error: files0-from with file operand'
args:
  - --files0-from=list
  - a.txt
files:
  a.txt: |
    a
  list: a.txt
tags:
  - manual
expect:
  exit: 1
  stdout: ""
  stderr: |
    $CMD: extra operand 'a.txt'
    file operands cannot be combined with --files0-from
    Try '$CMD --help' for more information.
