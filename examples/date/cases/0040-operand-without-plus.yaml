name: operand without plus
args:
  - -d
  - '@0'
  - '%s'
env:
  LC_ALL: C
  TZ: UTC
tags:
  - manual
expect:
  exit: 1
  stdout: ""
  stderr: |
    date: the argument '%s' lacks a leading '+';
    when using an option to specify date(s), any non-option
    argument must be a format string beginning with '+'
    Try 'date --help' for more information.
