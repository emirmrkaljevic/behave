name: output-error invalid
args:
  - --output-error=nope
stdin: |
  hi
tags:
  - manual
expect:
  exit: 1
  stdout: ""
  stderr: |
    $CMD: invalid argument ‘nope’ for ‘--output-error’
    Valid arguments are:
      - ‘warn’
      - ‘warn-nopipe’
      - ‘exit’
      - ‘exit-nopipe’
    Try '$CMD --help' for more information.
