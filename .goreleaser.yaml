version: 2
project_name: behave
builds:
  - main: ./cmd/behave
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^gofmt", "^docs:", "^README"]
